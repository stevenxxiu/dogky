[package]
name = "dogky"
version = "0.2.0"
edition = "2024"

[dependencies]
async-io = "2.6.0"
binary-heap-plus = "0.5.0"
chrono = "0.4.45"
circular-queue = "0.2.7"
csscolorparser = "0.9.0"
freya = "0.5.0-rc.10"
freya-clipboard = "0.5.0-rc.10"
freya-core = "0.5.0-rc.10"
freya-engine = "0.5.0-rc.10"
futures-lite = "2.6.1"
getifs = "0.7.0"
heck = "0.5.0"
join-string = "0.3.0"
lazy_static = "1.5.1"
noyalib = { version = "0.0.57", features = ["parallel", "simd"] }
nvml-wrapper = "0.13.0"
open = "5.4.4"
phf = { version = "0.14.0", features = ["macros"] }
public-ip = "0.2.2"
regex = "1.13.1"
reqwest = "0.13.5"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
shlex = "2.0.1"
swayipc = "4.0.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
uname = "0.1.1"
velcro = "0.5.4"
whoami = "2.1.3"
winit = "0.30.13"
xdg = "3.0.0"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
